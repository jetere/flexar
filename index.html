<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexar Node Graph Overlay</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    #flexar-canvas { z-index: 1; }
    #node-graph-canvas { z-index: 2; pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="flexar-canvas"></canvas>
  <canvas id="node-graph-canvas"></canvas>
  <script type="module" src="/src-node/main.js"></script>
</body>
</html>
